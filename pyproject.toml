[project]
name = "afterglow"
version = "0.1.0"
description = "OBS-triggered clip capture, local clip library, editor, and YouTube upload"
requires-python = ">=3.11"
dependencies = [
    "obsws-python",
    "tomli_w",
    "PySide6",
    "evdev",
    "python-mpv",
    "PyOpenGL",
]

[project.scripts]
afterglow = "afterglow.gui.main:main"
afterglow-daemon = "afterglow.daemon:main"
afterglow-cli = "afterglow.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["afterglow*"]

# GUI icon/texture assets (afterglow/gui/resources/) are loaded at runtime
# via importlib.resources, so they need to ship inside the installed
# package itself -- separate from data/icons/, which is the freedesktop
# icon-theme install (system tray/dock/taskbar) handled directly by
# flake.nix's postInstall, not by the Python package.
[tool.setuptools.package-data]
afterglow = ["gui/resources/*.png"]
